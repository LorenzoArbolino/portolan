# Chain pack: isoprenoids.
# Every CAS/HS code, route and seed hypothesis below is a starting point from general knowledge or a single
# source: research must verify each one. Routes are hypotheses about how molecules are made, not claims about any plant.

id: chain:isoprenoids
name: "Terpenes & isoprenoids: from base chemicals and pine to aroma chemicals and vitamins A/E"
version: 1.0
status: approved
approved_by: "LorenzoArbolino, 2026-10-25"
why_this_chain: >
  A handful of plants make the C10 building blocks (citral, linalool) behind both fragrances and
  vitamins A/E. The chain starts from base chemicals mapped by GEM (methanol, C4s, benzene/propylene → acetone)
  and from pine (crude sulphate turpentine from kraft pulp mills, which competes with renewable-fuel policy).
  One fire at BASF's Ludwigshafen citral plant (31 Oct 2017) forced force majeure on vitamins A/E and carotenoids;
  since then China has added large citral capacity (Wanhua, Yantai, 2024). The buyers (Givaudan, dsm-firmenich)
  are headquartered in Geneva.

# tier: base (route endpoint, plants come from the external GEM layer) | intermediate | specialty
# role: core (full world unit coverage) | feedstock | downstream | context (flows/routes only, no unit mapping)
