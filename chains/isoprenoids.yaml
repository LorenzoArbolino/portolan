routes:
  # base → intermediates
  - {id: "rte:formaldehyde:methanol-oxidation", product: mol:50-00-0, inputs: [mol:67-56-1]}
  - {id: "rte:acetone:cumene", product: mol:67-64-1, inputs: [mol:71-43-2, mol:115-07-1], note: "co-product with phenol"}
  - {id: "rte:isobutylene:c4-raffinate", product: mol:115-11-7, inputs: [mol:106-99-0], note: "proxy edge: same C4 cut, not a reaction from butadiene"}
  - {id: "rte:isoprenol:prins", product: mol:763-32-6, inputs: [mol:115-11-7, mol:50-00-0]}
  # pine branch
  - {id: "rte:pinenes:turpentine-fractionation", product: mol:80-56-8, inputs: [mol:8006-64-2], coproducts: [mol:127-91-3]}
  - {id: "rte:myrcene:beta-pinene-pyrolysis", product: mol:123-35-3, inputs: [mol:127-91-3]}
  - {id: "rte:linalool:pinene", product: mol:78-70-6, inputs: [mol:80-56-8], note: "via pinane / pinanol"}
  - {id: "rte:dihydromyrcenol:pinene", product: mol:18479-58-8, inputs: [mol:80-56-8], note: "via dihydromyrcene"}
  # petrochemical branch
  - {id: "rte:linalool:acetone-acetylene", product: mol:78-70-6, inputs: [mol:67-64-1, mol:74-86-2], note: "methylbutynol → methylheptenone → dehydrolinalool"}
  - {id: "rte:citral:isoprenol-prenal", product: mol:5392-40-5, inputs: [mol:763-32-6], note: "BASF-type route"}
  - {id: "rte:citral:dehydrolinalool", product: mol:5392-40-5, inputs: [mol:78-70-6]}
  # downstream
  - {id: "rte:beta-ionone:citral", product: mol:79-77-6, inputs: [mol:5392-40-5, mol:67-64-1], note: "aldol → pseudoionone → cyclisation"}
  - {id: "rte:vitamin-a:beta-ionone", product: mol:127-47-9, inputs: [mol:79-77-6]}
  - {id: "rte:vitamin-e:isophytol-tmhq", product: mol:7695-91-2, inputs: [mol:505-32-8, mol:700-13-0]}
  - {id: "rte:menthol:citral-citronellal", product: mol:2216-51-5, inputs: [mol:5392-40-5], note: "BASF-type route"}
  - {id: "rte:menthol:myrcene", product: mol:2216-51-5, inputs: [mol:123-35-3], note: "Takasago-type asymmetric route"}
  - {id: "rte:menthol:thymol", product: mol:2216-51-5, inputs: [], note: "from m-cresol (Symrise-type); add m-cresol as context if confirmed"}

