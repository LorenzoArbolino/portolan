name: deploy

# Builds the data bundle and the app, then publishes app/dist to GitHub Pages.
# Needs Pages enabled with "Source: GitHub Actions" (Settings → Pages).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build the data bundle
        run: |
          uv sync --locked
          uv run portolan build
          uv run portolan leak-check build/app
          mkdir -p app/public/data
          cp build/app/*.json build/app/*.geojson app/public/data/
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build the app
        working-directory: app
        run: npm ci && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
